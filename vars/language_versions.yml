---
gcp_cli_python_min_version: "3.9"
gcp_cli_python_max_version: "3.14"
gcp_cli_archive_name_x86_64: "google-cloud-cli-linux-x86_64.tar.gz"
python311_version: "3.11.9"
python312_version: "3.12.4"

# Pyenv configuration
pyenv_version: "v2.6.22"
pyenv_virtualenv_version: "v1.2.4"
pyenv_root: "{{ user_home }}/.pyenv"
pyenv_python_versions:
  - "3.11.9"
  - "3.12.4"
pyenv_global_version: "3.12.4"

# Go (Golang) configuration
golang_version: "1.24.1"
golang_additional_versions:
  - "1.21.13"
golang_install_gvm: true

# Lazygit configuration
lazygit_version: "0.44.1"

# Java/SDKMAN configuration
java_versions:
  - "11.0.21-tem"
  - "17.0.9-tem"
  - "21.0.1-tem"
java_default_version: "11.0.21-tem"
