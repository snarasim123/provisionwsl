---
###############################################################################
# xwayland: XWayland install, systemd services, Xorg divert,
#                    monitor config, LightDM, GPU env, start-desktop helper
###############################################################################

- name: Install xwayland
  become: true
  apt:
    name: xwayland
    state: present
  ignore_errors: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  tags:
    - gui
    - xwayland

# ── 3. Create and configure systemd services ─────────────────────────────────

- name: Install wslg-fix.service unit file
  become: true
  copy:
    src: wslg-fix.service
    dest: /etc/systemd/system/wslg-fix.service
    owner: root
    group: root
    mode: '0644'
  tags:
    - gui
    - xwayland

- name: Check the running init system
  command: cat /proc/1/comm
  register: xwayland_init
  changed_when: false
  check_mode: false
  tags:
    - gui
    - xwayland

- name: Enable wslg-fix.service
  become: true
  systemd:
    name: wslg-fix.service
    enabled: yes
    daemon_reload: yes
  when: xwayland_init.stdout | trim == 'systemd'
  tags:
    - gui
    - xwayland

- name: Enable wslg-fix.service for the next systemd boot
  become: true
  command: systemctl --root=/ enable wslg-fix.service
  args:
    creates: /etc/systemd/system/multi-user.target.wants/wslg-fix.service
  when: xwayland_init.stdout | trim != 'systemd'
  tags:
    - gui
    - xwayland

- name: Report pending systemd activation
  debug:
    msg: >
      Systemd is not PID 1 yet. Services are being configured offline.
      Restart this WSL distro after provisioning to activate systemd and
      wslg-fix.service. Desktop startup requires that restart.
  when: xwayland_init.stdout | trim != 'systemd'
  tags:
    - gui
    - xwayland

- name: Mask wslg-session user service (remove Wayland references)
  become: true
  file:
    src: /dev/null
    dest: /etc/systemd/user/wslg-session.service
    state: link
    force: yes
  tags:
    - gui
    - xwayland

- name: Set default systemd target to multi-user (prevent shell on distro open)
  become: true
  command: systemctl --root=/ set-default multi-user.target
  changed_when: true
  tags:
    - gui
    - xwayland

# ── 4. Replace default Xorg by XWayland ──────────────────────────────────────

- name: Deploy Xorg.Xwayland wrapper script
  become: true
  copy:
    src: Xorg.Xwayland
    dest: /usr/bin/Xorg.Xwayland
    owner: root
    group: root
    mode: '0755'
  tags:
    - gui
    - xwayland

- name: Set resolution in Xorg.Xwayland script
  become: true
  replace:
    path: /usr/bin/Xorg.Xwayland
    regexp: '@@XWAYLAND_RESOLUTION@@'
    replace: "{{ xwayland_resolution }}"
  tags:
    - gui
    - xwayland

- name: Divert original Xorg binary (dpkg-divert)
  become: true
  command: dpkg-divert --local --add --rename /usr/bin/Xorg
  args:
    creates: /usr/bin/Xorg.distrib
  tags:
    - gui
    - xwayland

- name: Register Xorg.Xwayland as Xorg alternative
  become: true
  command: update-alternatives --install /usr/bin/Xorg Xorg /usr/bin/Xorg.Xwayland 100
  changed_when: true
  tags:
    - gui
    - xwayland

# ── 5. Monitor resolution configuration ──────────────────────────────────────

- name: Ensure user .config directory exists
  file:
    path: "{{ user_home }}/.config"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  tags:
    - gui
    - xwayland

- name: Deploy monitors.xml for user
  template:
    src: monitors.xml.j2
    dest: "{{ user_home }}/.config/monitors.xml"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  tags:
    - gui
    - xwayland

# ── 6. LightDM configuration (MATE default display manager) ──────────────────

- name: Configure LightDM autologin
  become: true
  blockinfile:
    path: /etc/lightdm/lightdm.conf
    create: yes
    block: |
      [Seat:*]
      autologin-user={{ target_user }}
      autologin-user-timeout=0
    marker: "# {mark} ANSIBLE MANAGED - autologin"
  when: autologin_enabled | default(false)
  tags:
    - gui
    - xwayland

# ── 7. GPU / rendering environment variables ─────────────────────────────────

- name: Set GALLIUM_DRIVER=d3d12 for GPU acceleration in WSL
  become: true
  copy:
    content: |
      export GALLIUM_DRIVER="d3d12"
    dest: /etc/profile.d/wsl-gpu.sh
    owner: root
    group: root
    mode: '0644'
  tags:
    - gui
    - xwayland

- name: Ensure GALLIUM_DRIVER is in /etc/environment
  become: true
  lineinfile:
    path: /etc/environment
    regexp: '^GALLIUM_DRIVER='
    line: 'GALLIUM_DRIVER="d3d12"'
    state: present
  tags:
    - gui
    - xwayland

# ── 7b. Font scaling for the greeter and MATE (Xwayland defaults to 96 dpi) ──
# The greeter here is unity-greeter (not lightdm-gtk-greeter); it reads its
# font and DPI from the com.canonical.unity-greeter dconf schema.

- name: Ensure dconf system database directories exist
  become: true
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/dconf/profile
    - /etc/dconf/db/local.d
  tags:
    - gui
    - xwayland

- name: Enable dconf system database for users
  become: true
  copy:
    content: |
      user-db:user
      system-db:local
    dest: /etc/dconf/profile/user
    owner: root
    group: root
    mode: '0644'
    force: false
  tags:
    - gui
    - xwayland

- name: Set unity-greeter font and DPI (dconf)
  become: true
  copy:
    content: |
      [com/canonical/unity-greeter]
      font-name='{{ greeter_font }}'
      xft-dpi={{ desktop_dpi }}.0
    dest: /etc/dconf/db/local.d/01-unity-greeter
    owner: root
    group: root
    mode: '0644'
  register: xwayland_dconf_greeter
  tags:
    - gui
    - xwayland

- name: Set MATE font DPI system-wide (dconf)
  become: true
  copy:
    content: |
      [org/mate/desktop/font-rendering]
      dpi={{ desktop_dpi }}.0
    dest: /etc/dconf/db/local.d/00-xwayland-dpi
    owner: root
    group: root
    mode: '0644'
  register: xwayland_dconf_dpi
  tags:
    - gui
    - xwayland

- name: Refresh dconf database
  become: true
  command: dconf update
  when: xwayland_dconf_greeter is changed or xwayland_dconf_dpi is changed
  failed_when: false
  tags:
    - gui
    - xwayland

# ── 7c. Window Maker / plain X sessions: Xft DPI and Window Maker UI fonts ───
# MATE reads dconf; Window Maker and X11 apps read X resources. Window Maker's
# own menu and title fonts use fixed pixel sizes, so they are set explicitly.

- name: Set Xft.dpi for X sessions (merged by Xsession.d/30x11-common_xresources)
  become: true
  copy:
    content: |
      Xft.dpi: {{ desktop_dpi }}
    dest: /etc/X11/Xresources/xwayland-dpi
    owner: root
    group: root
    mode: '0644'
  tags:
    - gui
    - xwayland

- name: Check for Window Maker defaults file
  stat:
    path: "{{ user_home }}/GNUstep/Defaults/WindowMaker"
  register: xwayland_wmaker_defaults
  tags:
    - gui
    - xwayland

- name: Set Window Maker font and icon/dock/clip/drawer sizes
  lineinfile:
    path: "{{ user_home }}/GNUstep/Defaults/WindowMaker"
    regexp: '^\s*{{ item.key }}\s*='
    line: '  {{ item.key }} = {{ item.value }};'
  loop:
    - { key: WindowTitleFont, value: '"sans serif:bold:pixelsize={{ wmaker_font_pixelsize }}"' }
    - { key: MenuTitleFont, value: '"sans serif:bold:pixelsize={{ wmaker_font_pixelsize }}"' }
    - { key: MenuTextFont, value: '"sans serif:bold:pixelsize={{ wmaker_font_pixelsize }}"' }
    - { key: IconTitleFont, value: '"sans serif:bold:pixelsize={{ wmaker_font_pixelsize }}"' }
    - { key: ClipTitleFont, value: '"sans serif:bold:pixelsize={{ wmaker_font_pixelsize }}"' }
    - { key: LargeDisplayFont, value: '"sans serif:bold:pixelsize={{ wmaker_display_font_pixelsize }}"' }
    - { key: IconSize, value: '{{ wmaker_icon_size }}' }
  when: xwayland_wmaker_defaults.stat.exists
  tags:
    - gui
    - xwayland

# ── 8. Desktop session selection and start helper ────────────────────────────

- name: Validate desktop_session
  assert:
    that: desktop_session in desktop_sessions_supported
    fail_msg: "desktop_session must be one of {{ desktop_sessions_supported }}"
  tags:
    - gui
    - xwayland

- name: Ensure LightDM drop-in directory exists
  become: true
  file:
    path: /etc/lightdm/lightdm.conf.d
    state: directory
    mode: '0755'
  tags:
    - gui
    - xwayland

- name: Set LightDM autologin session to {{ desktop_session }}
  become: true
  copy:
    content: |
      [Seat:*]
      autologin-session={{ desktop_session }}
    dest: /etc/lightdm/lightdm.conf.d/50-desktop-session.conf
    owner: root
    group: root
    mode: '0644'
  tags:
    - gui
    - xwayland

- name: Install start-desktop helper script
  become: true
  copy:
    src: start-desktop.sh
    dest: /usr/local/bin/start-desktop.sh
    owner: root
    group: root
    mode: '0755'
  tags:
    - gui
    - xwayland

- name: Display post-install message
  debug:
    msg: >
      XWayland desktop role complete (session: {{ desktop_session }}).
      To start the desktop run:  sudo start-desktop.sh [mate|wmaker|xfce|stop]
      To shut down cleanly:      sudo poweroff
      Then terminate WSL:        wsl.exe --terminate {{ wsl_distro_name_override }}
  tags:
    - gui
    - xwayland
