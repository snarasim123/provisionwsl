---
###############################################################################
# xwayland: XWayland install, systemd services, Xorg divert,
#                    monitor config, LightDM, GPU env, start-desktop helper
###############################################################################

- name: Install xwayland
  become: true
  apt:
    name: xwayland
    state: present
  ignore_errors: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  tags:
    - gui
    - xwayland

# ── 3. Create and configure systemd services ─────────────────────────────────

- name: Install wslg-fix.service unit file
  become: true
  copy:
    src: wslg-fix.service
    dest: /etc/systemd/system/wslg-fix.service
    owner: root
    group: root
    mode: '0644'
  tags:
    - gui
    - xwayland

- name: Check the running init system
  command: cat /proc/1/comm
  register: xwayland_init
  changed_when: false
  check_mode: false
  tags:
    - gui
    - xwayland

- name: Enable wslg-fix.service
  become: true
  systemd:
    name: wslg-fix.service
    enabled: yes
    daemon_reload: yes
  when: xwayland_init.stdout | trim == 'systemd'
  tags:
    - gui
    - xwayland

- name: Enable wslg-fix.service for the next systemd boot
  become: true
  command: systemctl --root=/ enable wslg-fix.service
  args:
    creates: /etc/systemd/system/multi-user.target.wants/wslg-fix.service
  when: xwayland_init.stdout | trim != 'systemd'
  tags:
    - gui
    - xwayland

- name: Report pending systemd activation
  debug:
    msg: >
      Systemd is not PID 1 yet. Services are being configured offline.
      Restart this WSL distro after provisioning to activate systemd and
      wslg-fix.service. Desktop startup requires that restart.
  when: xwayland_init.stdout | trim != 'systemd'
  tags:
    - gui
    - xwayland

- name: Mask wslg-session user service (remove Wayland references)
  become: true
  file:
    src: /dev/null
    dest: /etc/systemd/user/wslg-session.service
    state: link
    force: yes
  tags:
    - gui
    - xwayland

- name: Set default systemd target to multi-user (prevent shell on distro open)
  become: true
  command: systemctl --root=/ set-default multi-user.target
  changed_when: true
  tags:
    - gui
    - xwayland

# ── 4. Replace default Xorg by XWayland ──────────────────────────────────────

- name: Deploy Xorg.Xwayland wrapper script
  become: true
  copy:
    src: Xorg.Xwayland
    dest: /usr/bin/Xorg.Xwayland
    owner: root
    group: root
    mode: '0755'
  tags:
    - gui
    - xwayland

- name: Set resolution in Xorg.Xwayland script
  become: true
  replace:
    path: /usr/bin/Xorg.Xwayland
    regexp: '@@XWAYLAND_RESOLUTION@@'
    replace: "{{ xwayland_resolution }}"
  tags:
    - gui
    - xwayland

- name: Divert original Xorg binary (dpkg-divert)
  become: true
  command: dpkg-divert --local --add --rename /usr/bin/Xorg
  args:
    creates: /usr/bin/Xorg.distrib
  tags:
    - gui
    - xwayland

- name: Register Xorg.Xwayland as Xorg alternative
  become: true
  command: update-alternatives --install /usr/bin/Xorg Xorg /usr/bin/Xorg.Xwayland 100
  changed_when: true
  tags:
    - gui
    - xwayland

# ── 5. Monitor resolution configuration ──────────────────────────────────────

- name: Ensure user .config directory exists
  file:
    path: "{{ user_home }}/.config"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  tags:
    - gui
    - xwayland

- name: Deploy monitors.xml for user
  template:
    src: monitors.xml.j2
    dest: "{{ user_home }}/.config/monitors.xml"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  tags:
    - gui
    - xwayland

# ── 6. LightDM configuration (MATE default display manager) ──────────────────

- name: Configure LightDM autologin
  become: true
  blockinfile:
    path: /etc/lightdm/lightdm.conf
    create: yes
    block: |
      [Seat:*]
      autologin-user={{ target_user }}
      autologin-user-timeout=0
    marker: "# {mark} ANSIBLE MANAGED - autologin"
  when: autologin_enabled | default(false)
  tags:
    - gui
    - xwayland

# ── 7. GPU / rendering environment variables ─────────────────────────────────

- name: Set GALLIUM_DRIVER=d3d12 for GPU acceleration in WSL
  become: true
  copy:
    content: |
      export GALLIUM_DRIVER="d3d12"
    dest: /etc/profile.d/wsl-gpu.sh
    owner: root
    group: root
    mode: '0644'
  tags:
    - gui
    - xwayland

- name: Ensure GALLIUM_DRIVER is in /etc/environment
  become: true
  lineinfile:
    path: /etc/environment
    regexp: '^GALLIUM_DRIVER='
    line: 'GALLIUM_DRIVER="d3d12"'
    state: present
  tags:
    - gui
    - xwayland

# ── 7b. Font scaling for the greeter and MATE (Xwayland defaults to 96 dpi) ──
# The greeter here is unity-greeter (not lightdm-gtk-greeter); it reads its
# font and DPI from the com.canonical.unity-greeter dconf schema.

- name: Ensure dconf system database directories exist
  become: true
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/dconf/profile
    - /etc/dconf/db/local.d
  tags:
    - gui
    - xwayland

- name: Enable dconf system database for users
  become: true
  copy:
    content: |
      user-db:user
      system-db:local
    dest: /etc/dconf/profile/user
    owner: root
    group: root
    mode: '0644'
    force: false
  tags:
    - gui
    - xwayland

- name: Set unity-greeter font and DPI (dconf)
  become: true
  copy:
    content: |
      [com/canonical/unity-greeter]
      font-name='{{ greeter_font }}'
      xft-dpi={{ desktop_dpi }}.0
      background='{{ greeter_background }}'
      draw-user-backgrounds={{ greeter_draw_user_backgrounds | bool | lower }}

      # The xrandr plugin resets the screen to the monitor size (5120x2880 on a 5K
      # display) after xwayland-resolution.sh has set xwayland_resolution.
      [com/canonical/unity/settings-daemon/plugins/xrandr]
      active=false
    dest: /etc/dconf/db/local.d/01-unity-greeter
    owner: root
    group: root
    mode: '0644'
  register: xwayland_dconf_greeter
  tags:
    - gui
    - xwayland

- name: Set MATE font DPI system-wide (dconf)
  become: true
  copy:
    content: |
      [org/mate/desktop/font-rendering]
      dpi={{ desktop_dpi }}.0

      # Keep the resolution set by xwayland-resolution.sh (see 01-unity-greeter)
      [org/mate/settings-daemon/plugins/xrandr]
      active=false
    dest: /etc/dconf/db/local.d/00-xwayland-dpi
    owner: root
    group: root
    mode: '0644'
  register: xwayland_dconf_dpi
  tags:
    - gui
    - xwayland

# Locked because unity-greeter writes active=true into the lightdm user's own dconf db,
# which would otherwise override the system value.
- name: Lock the xrandr plugin settings (dconf)
  become: true
  block:
    - name: Ensure dconf locks directory exists
      file:
        path: /etc/dconf/db/local.d/locks
        state: directory
        mode: '0755'

    - name: Write dconf locks for the xrandr plugins
      copy:
        content: |
          /com/canonical/unity/settings-daemon/plugins/xrandr/active
          /org/mate/settings-daemon/plugins/xrandr/active
        dest: /etc/dconf/db/local.d/locks/00-xwayland-xrandr
        owner: root
        group: root
        mode: '0644'
      register: xwayland_dconf_locks
  tags:
    - gui
    - xwayland

- name: Refresh dconf database
  become: true
  command: dconf update
  when: xwayland_dconf_greeter is changed or xwayland_dconf_dpi is changed or xwayland_dconf_locks is changed
  failed_when: false
  tags:
    - gui
    - xwayland

# ── 7c. Window Maker / plain X sessions: Xft DPI and Window Maker UI fonts ───
# MATE reads dconf; Window Maker and X11 apps read X resources. Window Maker's
# own menu and title fonts use fixed pixel sizes, so they are set explicitly.

- name: Set Xft.dpi for X sessions (merged by Xsession.d/30x11-common_xresources)
  become: true
  copy:
    content: |
      Xft.dpi: {{ desktop_dpi }}
    dest: /etc/X11/Xresources/xwayland-dpi
    owner: root
    group: root
    mode: '0644'
  tags:
    - gui
    - xwayland

# Window Maker normally creates these on its first start (/usr/bin/wmaker copies
# any missing file from /etc/GNUstep/Defaults). Provisioning runs before that
# first start, so seed them here the same way; existing files are never replaced.
- name: Ensure Window Maker user Defaults directory exists
  become: true
  file:
    path: "{{ user_home }}/GNUstep/Defaults"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  tags:
    - gui
    - xwayland
    - wmaker

- name: Seed Window Maker defaults from /etc/GNUstep/Defaults
  become: true
  copy:
    src: "/etc/GNUstep/Defaults/{{ item }}"
    dest: "{{ user_home }}/GNUstep/Defaults/{{ item }}"
    remote_src: true
    force: false
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  loop:
    - WindowMaker
    - WMRootMenu
    - WMState
  failed_when: false
  tags:
    - gui
    - xwayland
    - wmaker

- name: Check for Window Maker defaults file
  stat:
    path: "{{ user_home }}/GNUstep/Defaults/WindowMaker"
  register: xwayland_wmaker_defaults
  tags:
    - gui
    - xwayland
    - wmaker

- name: Set Window Maker font and icon/dock/clip/drawer sizes
  lineinfile:
    path: "{{ user_home }}/GNUstep/Defaults/WindowMaker"
    regexp: '^\s*{{ item.key }}\s*='
    line: '  {{ item.key }} = {{ item.value }};'
  loop:
    - { key: WindowTitleFont, value: '"sans serif:bold:pixelsize={{ wmaker_font_pixelsize }}"' }
    - { key: MenuTitleFont, value: '"sans serif:bold:pixelsize={{ wmaker_font_pixelsize }}"' }
    - { key: MenuTextFont, value: '"sans serif:bold:pixelsize={{ wmaker_font_pixelsize }}"' }
    - { key: IconTitleFont, value: '"sans serif:bold:pixelsize={{ wmaker_font_pixelsize }}"' }
    - { key: ClipTitleFont, value: '"sans serif:bold:pixelsize={{ wmaker_font_pixelsize }}"' }
    - { key: LargeDisplayFont, value: '"sans serif:bold:pixelsize={{ wmaker_display_font_pixelsize }}"' }
    - { key: IconSize, value: '{{ wmaker_icon_size }}' }
  when: xwayland_wmaker_defaults.stat.exists
  tags:
    - gui
    - xwayland
    - wmaker

# ── 7d. XFCE font, icon, panel and cursor sizes ──────────────────────────────
# The user's xfconf files exist after the first XFCE login and override system
# defaults, so values are written per user with xfconf-query (in a private D-Bus
# session; XFCE reads them at the next login). Panel properties are only changed
# when the panel exists. The XFCE packages come from packages_ubuntu_gui.

- name: Check for xfconf-query
  stat:
    path: /usr/bin/xfconf-query
  register: xwayland_xfconf
  tags:
    - gui
    - xwayland

- name: Set XFCE sizes with xfconf-query
  become: true
  become_user: "{{ target_user }}"
  shell: |
    cur=$(dbus-run-session -- xfconf-query -c {{ item.channel }} -p {{ item.prop }} 2>/dev/null) || cur=__unset__
    if [ "{{ item.existing_only | default(false) | bool | lower }}" = true ] && [ "$cur" = __unset__ ]; then exit 0; fi
    if [ "$cur" != "{{ item.value }}" ]; then
      dbus-run-session -- xfconf-query -c {{ item.channel }} -p {{ item.prop }} -n -t {{ item.type }} -s "{{ item.value }}"
      echo CHANGED
    fi
  args:
    executable: /bin/bash
  environment:
    HOME: "{{ user_home }}"
  loop:
    # Fonts and DPI
    - { channel: xsettings, prop: /Xft/DPI, type: int, value: "{{ desktop_dpi }}" }
    - { channel: xsettings, prop: /Gtk/FontName, type: string, value: "Sans {{ xfce_font_size }}" }
    - { channel: xsettings, prop: /Gtk/MonospaceFontName, type: string, value: "Monospace {{ xfce_font_size }}" }
    - { channel: xsettings, prop: /Gtk/CursorThemeSize, type: int, value: "{{ xfce_cursor_size }}" }
    - { channel: xfwm4, prop: /general/theme, type: string, value: "{{ xfce_wm_theme }}" }
    - { channel: xfwm4, prop: /general/title_font, type: string, value: "Sans Bold {{ xfce_title_font_size }}" }
    - { channel: xfwm4, prop: /general/use_compositing, type: bool, value: "{{ xfce_compositing | bool | lower }}" }
    # Top panel and bottom dock
    - { channel: xfce4-panel, prop: /panels/panel-1/size, type: uint, value: "{{ xfce_panel_size }}", existing_only: true }
    - { channel: xfce4-panel, prop: /panels/panel-1/icon-size, type: uint, value: "{{ xfce_panel_icon_size }}", existing_only: true }
    - { channel: xfce4-panel, prop: /panels/panel-2/size, type: uint, value: "{{ xfce_dock_size }}", existing_only: true }
    # Desktop icons
    - { channel: xfce4-desktop, prop: /desktop-icons/icon-size, type: uint, value: "{{ xfce_desktop_icon_size }}" }
    - { channel: xfce4-desktop, prop: /desktop-icons/use-custom-font-size, type: bool, value: "true" }
    - { channel: xfce4-desktop, prop: /desktop-icons/font-size, type: double, value: "{{ xfce_desktop_font_size }}" }
  loop_control:
    label: "{{ item.channel }}{{ item.prop }}"
  register: xwayland_xfce_sizes
  changed_when: "'CHANGED' in xwayland_xfce_sizes.stdout"
  when: xwayland_xfconf.stat.exists
  tags:
    - gui
    - xwayland

# WINGs (the toolkit behind the Run dialog, alerts, input panels and WPrefs)
# reads its fonts from the WMGLOBAL domain and scales those panels from the
# system font size.
- name: Set WINGs dialog font size (WMGLOBAL)
  copy:
    content: |
      {
        SystemFont = "sans serif:pixelsize={{ wmaker_dialog_font_pixelsize }}";
        BoldSystemFont = "sans serif:bold:pixelsize={{ wmaker_dialog_font_pixelsize }}";
        DefaultFontSize = {{ wmaker_dialog_font_pixelsize }};
        AntialiasedText = YES;
      }
    dest: "{{ user_home }}/GNUstep/Defaults/WMGLOBAL"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  when: xwayland_wmaker_defaults.stat.exists
  tags:
    - gui
    - xwayland
    - wmaker_dialogs
    - wmaker

# ── 7d2. Window Maker dock launchers (Firefox, Chromium, ...) ─────────────────
# Renders the whole dock from wmaker_dock_apps on every run, so dock changes made
# in the GUI are replaced. Set wmaker_manage_dock: false to leave the dock alone.
# Window Maker rewrites WMState when it exits, so run this while it is stopped.

- name: Deploy Window Maker dock (WMState) and dock icons (WMWindowAttributes)
  template:
    src: "{{ item }}.j2"
    dest: "{{ user_home }}/GNUstep/Defaults/{{ item }}"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
    backup: yes
  loop:
    - WMState
    - WMWindowAttributes
  when:
    - wmaker_manage_dock | bool
    - xwayland_wmaker_defaults.stat.exists
  tags:
    - gui
    - xwayland
    - wmaker_dock
    - wmaker

# ── 7e. Audio: use the WSLg PulseAudio server, never a local daemon ──────────
# WSLg exposes PulseAudio at /mnt/wslg/PulseServer, but LightDM sessions do not
# inherit PULSE_SERVER, and the apt pulseaudio package starts its own daemon
# (socket-activated) with no sound device. Point every client at WSLg through
# client.conf and mask the local daemon.

- name: Ensure pulse client.conf.d exists
  become: true
  file:
    path: /etc/pulse/client.conf.d
    state: directory
    mode: '0755'
  tags:
    - gui
    - xwayland
    - audio

- name: Point PulseAudio clients at the WSLg server
  become: true
  copy:
    content: |
      default-server = unix:/mnt/wslg/PulseServer
      autospawn = no
    dest: /etc/pulse/client.conf.d/00-wslg.conf
    owner: root
    group: root
    mode: '0644'
  tags:
    - gui
    - xwayland
    - audio

- name: Mask the local PulseAudio user units (WSLg provides the server)
  become: true
  file:
    src: /dev/null
    dest: "/etc/systemd/user/{{ item }}"
    state: link
    force: yes
  loop:
    - pulseaudio.service
    - pulseaudio.socket
  tags:
    - gui
    - xwayland
    - audio

# VLC's PulseAudio output keeps losing sync with the WSLg RDP sink ("cannot synchronize
# start", "flushing buffers"), and video stutters because VLC times it against audio.
# ALSA output still reaches WSLg through the ALSA pulse plugin, without the sync errors.
# Other video players that sync video to audio can stutter the same way; switch their
# audio output to ALSA too, e.g. mpv: ao=alsa in ~/.config/mpv/mpv.conf; GStreamer
# apps: set the audio sink to alsasink. Audio-only players (Clementine, Rhythmbox,
# Audacious) have no video to stutter and are left on PulseAudio (untested); switch
# them only if the audio drops out.
- name: Ensure VLC config directory exists
  become: true
  become_user: "{{ target_user }}"
  file:
    path: "{{ user_home }}/.config/vlc"
    state: directory
    mode: '0755'
  tags:
    - gui
    - xwayland
    - audio

- name: Use ALSA audio output in VLC
  become: true
  become_user: "{{ target_user }}"
  community.general.ini_file:
    path: "{{ user_home }}/.config/vlc/vlcrc"
    section: core
    option: aout
    value: alsa
    no_extra_spaces: true
    mode: '0644'
  tags:
    - gui
    - xwayland
    - audio

# ── 8. Desktop session selection and start helper ────────────────────────────

- name: Validate desktop_session
  assert:
    that: desktop_session in desktop_sessions_supported
    fail_msg: "desktop_session must be one of {{ desktop_sessions_supported }}"
  tags:
    - gui
    - xwayland

- name: Ensure LightDM drop-in directory exists
  become: true
  file:
    path: /etc/lightdm/lightdm.conf.d
    state: directory
    mode: '0755'
  tags:
    - gui
    - xwayland

- name: Set LightDM autologin session to {{ desktop_session }}
  become: true
  copy:
    content: |
      [Seat:*]
      autologin-session={{ desktop_session }}
      user-session={{ desktop_session }}
    dest: /etc/lightdm/lightdm.conf.d/50-desktop-session.conf
    owner: root
    group: root
    mode: '0644'
  tags:
    - gui
    - xwayland

# WSLg sizes the Xwayland window to the monitor (5120x2880 on a 5K display) whatever
# -geometry says. LightDM runs this script after the X server starts, before the greeter.
- name: Install Xwayland resolution setup script
  become: true
  copy:
    content: |
      #!/bin/sh
      # LightDM display-setup-script: set the X screen to {{ xwayland_resolution }}
      out=$(xrandr | awk '/ connected/ {print $1; exit}')
      xrandr --output "$out" --mode {{ xwayland_resolution }} ||
        systemd-cat -t xwayland-resolution echo "mode {{ xwayland_resolution }} not available on $out"
      exit 0
    dest: /usr/local/bin/xwayland-resolution.sh
    owner: root
    group: root
    mode: '0755'
  tags:
    - gui
    - xwayland

- name: Run the resolution script when LightDM starts X
  become: true
  copy:
    content: |
      [Seat:*]
      display-setup-script=/usr/local/bin/xwayland-resolution.sh
    dest: /etc/lightdm/lightdm.conf.d/40-xwayland-resolution.conf
    owner: root
    group: root
    mode: '0644'
  tags:
    - gui
    - xwayland

- name: Install start-desktop helper script
  become: true
  copy:
    src: start-desktop.sh
    dest: /usr/local/bin/start-desktop.sh
    owner: root
    group: root
    mode: '0755'
  tags:
    - gui
    - xwayland

- name: Display post-install message
  debug:
    msg: >
      XWayland desktop role complete (session: {{ desktop_session }}).
      To start the desktop run:  sudo start-desktop.sh [mate|wmaker|xfce|stop]
      To shut down cleanly:      sudo poweroff
      Then terminate WSL:        wsl.exe --terminate {{ wsl_distro_name_override }}
  tags:
    - gui
    - xwayland
