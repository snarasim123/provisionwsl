---
###############################################################################
# mate-desktop: Prerequisites
###############################################################################

- name: Check that the /etc/wsl.conf exists (WSL only)
  stat:
    path: /etc/wsl.conf
  register: wsl_conf_stat
  tags:
    - gui
    - mate-desktop

- name: Ensure systemd is enabled in /etc/wsl.conf
  become: true
  lineinfile:
    path: /etc/wsl.conf
    regexp: '^systemd\s*='
    line: 'systemd=true'
    insertafter: '^\[boot\]'
    create: no
  when: wsl_conf_stat.stat.exists
  tags:
    - gui
    - mate-desktop

- name: Read Ubuntu system Python version
  command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import configparser
        defaults = configparser.ConfigParser()
        with open('/usr/share/python3/debian_defaults') as source:
            defaults.read_file(source)
        print(defaults['DEFAULT']['default-version'])
  register: mate_system_python
  changed_when: false
  check_mode: false
  tags:
    - gui
    - mate-desktop

- name: Ensure python3 points to Ubuntu system Python
  become: true
  alternatives:
    name: python3
    path: "/usr/bin/{{ mate_system_python.stdout | trim }}"
    link: /usr/bin/python3
    priority: 100
  tags:
    - gui
    - mate-desktop

# todo - dup of roles/packages/tasks/main.yml - Update apt cache 2 - rename this
- name: Update apt cache
  become: true
  apt:
    update_cache: yes
    cache_valid_time: 3600
  tags:
    - gui
    - mate-desktop

- name: Fix dpkg if interrupted
  become: true
  command: dpkg --configure -a
  changed_when: false
  ignore_errors: true
  tags:
    - gui
    - mate-desktop

- name: Upgrade all packages
  become: true
  apt:
    upgrade: safe
  ignore_errors: true
  tags:
    - gui
    - mate-desktop
