---
###############################################################################
# xwayland-desktop: Install Ubuntu MATE Desktop with XWayland on WSL2/WSLg
# Reference: https://gist.github.com/tdcosta100/e28636c216515ca88d1f2e7a2e188912
# Target: Ubuntu 24.04 (sample_ubuntu_2404)
###############################################################################

# ── Install desktop environment & xwayland ────────────────────────────────

# Pre-install the largest dependencies individually so progress is visible
# and any single-package failure is easy to diagnose.

- name: Install xterm
  become: true
  apt:
    name: xterm
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive
  tags:
    - xwayland-desktop

- name: Install fonts-dejavu-core
  become: true
  apt:
    name: fonts-dejavu-core
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive
  tags:
    - xwayland-desktop

- name: Install printer-driver-pnm2ppa
  become: true
  apt:
    name: printer-driver-pnm2ppa
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive
  tags:
    - xwayland-desktop

- name: Install language-selector-common
  become: true
  apt:
    name: language-selector-common
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive
  tags:
    - xwayland-desktop

# Skipped: update-manager — pulls in heavy GNOME deps (gdm3, gnome-shell)
# when installed standalone. Let the desktop metapackage resolve it instead.

- name: Fix dpkg state before metapackage install
  become: true
  command: dpkg --configure -a
  changed_when: false
  ignore_errors: true
  tags:
    - xwayland-desktop

- name: Fix broken dependencies before metapackage install
  become: true
  command: apt-get -f install -y
  environment:
    DEBIAN_FRONTEND: noninteractive
  changed_when: false
  ignore_errors: true
  tags:
    - xwayland-desktop

- name: Install {{ desktop_metapackage }}
  become: true
  apt:
    name: "{{ desktop_metapackage }}"
    state: present
  ignore_errors: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  tags:
    - xwayland-desktop

