# SDKMAN and JDK installation tasks
# Installs SDKMAN and Java versions defined in vars/language_versions.yml
# To enable: uncomment in dev/tasks/main.yml
---

- name: Install dependencies for SDKMAN
  package:
    name:
      - curl
      - unzip
      - zip
    state: present
  become: true
  tags:
    - jdk
    - java
    - sdkman
    - dev

- name: Check if SDKMAN is already installed
  stat:
    path: "{{ user_home }}/.sdkman/bin/sdkman-init.sh"
  register: sdkman_installed
  tags:
    - jdk
    - java
    - sdkman
    - dev

- name: Download and install SDKMAN
  shell: |
    curl -s "https://get.sdkman.io" | bash
  args:
    creates: "{{ user_home }}/.sdkman/bin/sdkman-init.sh"
  become: true
  become_user: "{{ target_user }}"
  when: not sdkman_installed.stat.exists
  tags:
    - jdk
    - java
    - sdkman
    - dev

- name: Install Java versions via SDKMAN
  shell: |
    source {{ user_home }}/.sdkman/bin/sdkman-init.sh
    sdk install java {{ item }} || true
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ target_user }}"
  loop: "{{ java_versions }}"
  register: java_install
  changed_when: "'Done installing' in java_install.stdout"
  tags:
    - jdk
    - java
    - sdkman
    - dev

- name: Set Java {{ java_default_version }} as default
  shell: |
    source {{ user_home }}/.sdkman/bin/sdkman-init.sh
    sdk default java {{ java_default_version }}
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ target_user }}"
  tags:
    - jdk
    - java
    - sdkman
    - dev

- name: Verify Java installation
  shell: |
    source {{ user_home }}/.sdkman/bin/sdkman-init.sh
    java -version 2>&1
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ target_user }}"
  register: java_version
  changed_when: false
  tags:
    - jdk
    - java
    - sdkman
    - dev

- name: Display installed Java version
  debug:
    msg: "{{ java_version.stdout_lines }}"
  tags:
    - jdk
    - java
    - sdkman
    - dev

- name: List all installed Java versions
  shell: |
    source {{ user_home }}/.sdkman/bin/sdkman-init.sh
    sdk current java
    echo "---"
    ls -1 {{ user_home }}/.sdkman/candidates/java/ | grep -v current
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ target_user }}"
  register: java_list
  changed_when: false
  tags:
    - jdk
    - java
    - sdkman
    - dev

- name: Display installed Java versions
  debug:
    msg: "{{ java_list.stdout_lines }}"
  tags:
    - jdk
    - java
    - sdkman
    - dev

- name: Add SDKMAN init to .bashrc_custom
  blockinfile:
    path: "{{ user_home }}/.bashrc_custom"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - sdkman"
    block: |
      export SDKMAN_DIR="{{ user_home }}/.sdkman"
      [[ -s "$SDKMAN_DIR/bin/sdkman-init.sh" ]] && source "$SDKMAN_DIR/bin/sdkman-init.sh"
  become: true
  become_user: "{{ target_user }}"
  tags:
    - jdk
    - java
    - sdkman
    - dev
