---
# GUI bindings belong to the distro Python, not the Ansible controller or pyenv.

# Python packages for git-cola and GUI development tools
# Installs distro-specific PyQt5 and related packages

- name: Install Python packages for git-cola (Ubuntu)
  apt:
    name:
      - python3-pyqt5
      - python3-qtpy
      - python3-send2trash
      # polib from apt: pip installs into system python are blocked on 24.04 (PEP 668)
      - python3-polib
    state: present
  become: true
  when: is_ubuntu | default(false)
  tags:
    - python
    - dev
