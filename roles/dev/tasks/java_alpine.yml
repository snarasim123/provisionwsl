---
- name: Configure native Alpine JDK
  tags:
    - jdk
    - java
    - dev
  block:
    - name: Validate Alpine JDK selection
      ansible.builtin.assert:
        that:
          - alpine_java_versions | length > 0
          - alpine_java_versions | map('string') | select('match', '^[0-9]+$') | list | length == alpine_java_versions | length
          - alpine_java_default_version | string in (alpine_java_versions | map('string') | list)
        fail_msg: Alpine JDK versions must be numeric majors and include the default version.

    - name: Install Alpine OpenJDK versions
      community.general.apk:
        name: "{{ alpine_java_versions | map('regex_replace', '^', 'openjdk') | map('regex_replace', '$', '-jdk') | list }}"
        state: present
      become: true

    - name: Remove SDKMAN installer initialization from Bash
      ansible.builtin.lineinfile:
        path: "{{ user_home }}/.bashrc"
        regexp: '^(export SDKMAN_DIR=|\[\[.*sdkman-init\.sh)'
        state: absent
      become: true
      become_user: "{{ target_user }}"

    - name: Remove managed SDKMAN initialization
      ansible.builtin.blockinfile:
        path: "{{ user_home }}/.bashrc_custom"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - sdkman"
        state: absent
      become: true
      become_user: "{{ target_user }}"

    - name: Install Alpine Java shell switcher
      ansible.builtin.copy:
        src: java-functions.sh
        dest: "{{ user_home }}/.java_funcs"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0644'
      become: true

    - name: Set Alpine OpenJDK as the user default
      ansible.builtin.blockinfile:
        path: "{{ user_home }}/.bashrc_custom"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - alpine-java"
        block: |
          source "{{ user_home }}/.java_funcs"
          java-use "{{ alpine_java_default_version }}" >/dev/null
      become: true
      become_user: "{{ target_user }}"

    - name: Verify Alpine JDK runtimes and compilers
      ansible.builtin.shell: |
        set -e
        "$JAVA_HOME/bin/java" -version 2>&1
        "$JAVA_HOME/bin/javac" -version 2>&1
      environment:
        JAVA_HOME: "/usr/lib/jvm/java-{{ item }}-openjdk"
      loop: "{{ alpine_java_versions }}"
      become: true
      become_user: "{{ target_user }}"
      register: alpine_java_version
      changed_when: false

    - name: Display Alpine JDK versions
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ alpine_java_version.results }}"
      loop_control:
        label: "{{ item.item }}"
