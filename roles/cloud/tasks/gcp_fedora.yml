---
# Google Cloud CLI installation for Fedora/RHEL/CentOS
# https://docs.cloud.google.com/sdk/docs/install-sdk#red-hatfedoracentos
# https://cloud.google.com/sdk/docs/install#rpm

- name: Select Google Cloud Python runtime
  ansible.builtin.import_tasks: gcp_runtime.yml
  tags:
    - gcp
    - cloud

- name: Add Google Cloud CLI repository
  ansible.builtin.yum_repository:
    name: google-cloud-cli
    description: Google Cloud CLI
    baseurl: https://packages.cloud.google.com/yum/repos/cloud-sdk-el9-x86_64
    enabled: yes
    gpgcheck: yes
    repo_gpgcheck: no
    gpgkey:
      - https://packages.cloud.google.com/yum/doc/rpm-package-key.gpg
  become: true
  tags:
    - gcp
    - cloud

- name: Install libxcrypt-compat for legacy crypt library support
  ansible.builtin.dnf:
    name: libxcrypt-compat.x86_64
    state: present
  become: true
  tags:
    - gcp
    - cloud

- name: Install Google Cloud CLI via dnf
  ansible.builtin.dnf:
    name: google-cloud-cli
    state: present
  become: true
  tags:
    - gcp
    - cloud

- name: Verify gcloud install location (fedora)
  ansible.builtin.command:
    cmd: which gcloud
  register: gcloud_location
  changed_when: false
  tags:
    - gcp
    - cloud

- name: Print gcloud install location (fedora)
  ansible.builtin.debug:
    msg: "gcloud installed at: {{ gcloud_location.stdout | default('gcloud not found in PATH') }}"
  tags:
    - gcp
    - cloud

- name: Verify gcloud version (fedora)
  ansible.builtin.command:
    cmd: gcloud --version
  environment: "{{ gcp_runtime_environment }}"
  register: gcloud_version
  changed_when: false
  tags:
    - gcp
    - cloud

- name: Print gcloud version (fedora)
  ansible.builtin.debug:
    msg: "{{ gcloud_version.stdout_lines | default(['gcloud version not available']) }}"
  tags:
    - gcp
    - cloud

- name: Set fact that GCP CLI is installed (fedora)
  ansible.builtin.set_fact:
    gcp_cli_installed: true
  when: gcloud_version.rc == 0
  tags:
    - gcp
    - cloud

- name: Install gke-gcloud-auth-plugin for GKE authentication (Fedora)
  ansible.builtin.dnf:
    name: google-cloud-cli-gke-gcloud-auth-plugin
    state: present
  become: true
  when: gcloud_version.rc == 0
  tags:
    - gcp
    - cloud
    - gke

- name: Validate Google Cloud and GKE runtimes
  ansible.builtin.import_tasks: gcp_verify.yml
  vars:
    gcp_binary_dir: /usr/bin
  tags: [gcp, cloud]
