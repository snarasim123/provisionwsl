---
# Google Cloud CLI installation for Alpine Linux
# Alpine doesn't have an official gcloud package, so we use the tarball method
# https://cloud.google.com/sdk/docs/install-sdk#linux

- name: Select musl-compatible Google Cloud Python runtime
  ansible.builtin.import_tasks: gcp_runtime.yml
  tags:
    - gcp
    - cloud

- name: Install required dependencies for Google Cloud CLI on Alpine
  community.general.apk:
    name:
      - bash
      - curl
      - python3
    state: present
  become: true
  tags:
    - gcp
    - cloud

# todo - dup of roles/cloud/tasks/gcp_debian.yml - Check if Google Cloud CLI tar file exists 74 - rename this
- name: Check if Google Cloud CLI tar file exists
  ansible.builtin.stat:
    path: "/home/{{ target_user }}/tmp/{{ gcp_cli_archive_name_x86_64 }}"
  register: gcp_cli_tar_file
  tags:
    - gcp
    - cloud

# todo - dup of roles/cloud/tasks/gcp_debian.yml - Remove existing Google Cloud CLI tar file if present 79 - rename this
- name: Remove existing Google Cloud CLI tar file if present
  ansible.builtin.file:
    path: "/home/{{ target_user }}/tmp/{{ gcp_cli_archive_name_x86_64 }}"
    state: absent
  when: gcp_cli_tar_file.stat.exists
  tags:
    - gcp
    - cloud

# todo - dup of roles/cloud/tasks/gcp_debian.yml - Download Google Cloud CLI tar file 85 - rename this
- name: Download Google Cloud CLI tar file
  ansible.builtin.get_url:
    url: https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/{{ gcp_cli_archive_name_x86_64 }}
    dest: "/home/{{ target_user }}/tmp/{{ gcp_cli_archive_name_x86_64 }}"
    mode: '0644'
  tags:
    - gcp
    - cloud

# todo - dup of roles/cloud/tasks/gcp_debian.yml - Extract Google Cloud CLI tar file to /usr/local 91 - rename this
- name: Extract Google Cloud CLI tar file to /usr/local
  ansible.builtin.unarchive:
    src: "/home/{{ target_user }}/tmp/{{ gcp_cli_archive_name_x86_64 }}"
    dest: "/usr/local"
    remote_src: true
  become: true
  tags:
    - gcp
    - cloud

# todo - dup of roles/cloud/tasks/gcp_debian.yml - Ensure install.sh has executable permissions 98 - rename this
- name: Ensure install.sh has executable permissions
  ansible.builtin.file:
    path: "/usr/local/google-cloud-sdk/install.sh"
    mode: '0755'
  become: true
  tags:
    - gcp
    - cloud

# todo - dup of roles/cloud/tasks/gcp_debian.yml - Run Google Cloud CLI install script 104 - rename this
- name: Run Google Cloud CLI install script
  ansible.builtin.shell:
    cmd: /usr/local/google-cloud-sdk/install.sh --quiet --path-update true --command-completion true --install-python=false 2>&1
  environment: "{{ gcp_runtime_environment }}"
  register: gcp_install_output
  become: true
  tags:
    - gcp
    - cloud

# todo - dup of roles/cloud/tasks/gcp_debian.yml - Print Google Cloud CLI install script output 111 - rename this
- name: Print Google Cloud CLI install script output
  ansible.builtin.debug:
    msg: 
      - "Return code: {{ gcp_install_output.rc }}"
      - "Output: {{ gcp_install_output.stdout_lines | default([]) }}"
  tags:
    - gcp
    - cloud

# todo - dup of roles/cloud/tasks/gcp_debian.yml - Verify gcloud install location 141 - rename this
- name: Verify gcloud install location
  ansible.builtin.command:
    cmd: which gcloud
  environment:
    PATH: "/usr/local/google-cloud-sdk/bin:{{ ansible_facts['env']['PATH'] }}"
  register: gcloud_location
  changed_when: false
  tags:
    - gcp
    - cloud

# todo - dup of roles/cloud/tasks/gcp_debian.yml - Print gcloud install location 153 - rename this
- name: Print gcloud install location
  ansible.builtin.debug:
    msg: "gcloud installed at: {{ gcloud_location.stdout | default('gcloud not found in PATH') }}"
  tags:
    - gcp
    - cloud

# todo - dup of roles/cloud/tasks/gcp_debian.yml - Verify gcloud version 160 - rename this
- name: Verify gcloud version
  ansible.builtin.command:
    cmd: gcloud --version
  environment:
    PATH: "/usr/local/google-cloud-sdk/bin:{{ ansible_facts['env']['PATH'] }}"
    CLOUDSDK_PYTHON: "{{ gcp_selected_python }}"
  register: gcloud_version
  changed_when: false
  tags:
    - gcp
    - cloud

# todo - dup of roles/cloud/tasks/gcp_debian.yml - Print gcloud version 172 - rename this
- name: Print gcloud version
  ansible.builtin.debug:
    msg: "{{ gcloud_version.stdout_lines | default(['gcloud version not available']) }}"
  tags:
    - gcp
    - cloud

# todo - dup of roles/cloud/tasks/gcp_debian.yml - Set fact that GCP CLI is installed 179 - rename this
- name: Set fact that GCP CLI is installed
  ansible.builtin.set_fact:
    gcp_cli_installed: true
  when: gcloud_version.rc == 0
  tags:
    - gcp
    - cloud

- name: Install gke-gcloud-auth-plugin for GKE authentication (Alpine)
  ansible.builtin.command:
    cmd: /usr/local/google-cloud-sdk/bin/gcloud components install gke-gcloud-auth-plugin --quiet
  environment:
    PATH: "/usr/local/google-cloud-sdk/bin:{{ ansible_facts['env']['PATH'] }}"
    CLOUDSDK_PYTHON: "{{ gcp_selected_python }}"
  become: true
  when: gcloud_version.rc == 0
  register: gke_plugin_install
  changed_when: "'All components are up to date' not in gke_plugin_install.stderr"
  tags:
    - gcp
    - cloud
    - gke

- name: Validate Google Cloud and GKE runtimes
  ansible.builtin.import_tasks: gcp_verify.yml
  vars:
    gcp_binary_dir: /usr/local/google-cloud-sdk/bin
  tags: [gcp, cloud]

# todo - dup of roles/cloud/tasks/gcp_debian.yml - Remove Google Cloud CLI tar file from tmp folder 117 - rename this
- name: Remove Google Cloud CLI tar file from tmp folder
  ansible.builtin.file:
    path: "/home/{{ target_user }}/tmp/{{ gcp_cli_archive_name_x86_64 }}"
    state: absent
  tags:
    - gcp
    - cloud