- name: update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  become: true
  tags: packages
  when: is_ubuntu

- name: update dnf cache
  dnf:
    update_cache: yes
  become: true
  tags: packages
  when: is_fedora

- name: update apk cache
  community.general.apk:
    update_cache: yes
  become: true
  tags: packages
  when: is_alpine

# - name: Update all Debian/Ubuntu packages to their latest version
#   ansible.builtin.apt:
#     name: "*"
#     state: latest
#   become: yes
#   tags: packages
#   when: is_ubuntu

- name: Install ubuntu packages
  apt:
    name: "{{ packages_ubuntu }}"
  become: true
  tags: packages
  when: is_ubuntu

- name: Install ubuntu GUI packages
  apt:
    name: "{{ packages_ubuntu_gui }}"
  become: true
  tags:
    - packages
    - gui
  when: is_ubuntu and not (gui_skipped | default(false))

# Google Chrome is not in the Ubuntu archive; install it from Google's apt repo (amd64 only).
- name: Create apt keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true
  tags:
    - packages
    - gui
    - chrome
  when: is_ubuntu and ansible_architecture == 'x86_64' and not (gui_skipped | default(false))

- name: Add Google Chrome apt signing key
  get_url:
    url: https://dl.google.com/linux/linux_signing_key.pub
    dest: /etc/apt/keyrings/google-chrome.asc
    mode: '0644'
  become: true
  tags:
    - packages
    - gui
    - chrome
  when: is_ubuntu and ansible_architecture == 'x86_64' and not (gui_skipped | default(false))

- name: Add Google Chrome apt repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.asc] https://dl.google.com/linux/chrome/deb/ stable main"
    filename: google-chrome
    state: present
  become: true
  tags:
    - packages
    - gui
    - chrome
  when: is_ubuntu and ansible_architecture == 'x86_64' and not (gui_skipped | default(false))

- name: Install Google Chrome
  apt:
    name: google-chrome-stable
    state: present
  become: true
  tags:
    - packages
    - gui
    - chrome
  when: is_ubuntu and ansible_architecture == 'x86_64' and not (gui_skipped | default(false))

